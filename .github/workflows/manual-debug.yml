name: Manual Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Eta build environment
        uses: ./.github/actions/setup-build

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --no-configuration-cache \
            "-Peta.buildMetadata=${GITHUB_SHA::7}" \
            :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Eta-debug-apk
          path: app/build/outputs/apk/debug/Eta-v*.apk
          if-no-files-found: error
